<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucent — Voice Output</title>
    <link rel="stylesheet" href="/static/style.css?v=1000">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>Lucent</h1>
            <div class="controls">
                <select id="avatarSelect" class="avatar-selector">
                    <option value="">Loading avatars...</option>
                </select>
                <button id="activityLogBtn" class="activity-log-btn" title="View activity log">📋</button>
                <select id="voiceSelect" class="voice-selector">
                    <option value="">Loading voices...</option>
                </select>
                <button id="themeToggle" class="theme-toggle" title="Toggle light/dark theme">🌙</button>
            </div>
        </div>

        <!-- Main panels grid -->
        <div class="panels-grid">
            <!-- Services Panel -->
            <div class="services-panel">
                <div class="panel-label">Services</div>
                <div class="services-list" id="servicesList"></div>
            </div>

            <!-- Voice Panel -->
            <div class="voice-panel">
                <div class="panel-label" id="voicePanelLabel">AI VOICE BOX — IDLE</div>

                <!-- Knight Rider Scanner -->
                <div id="scanner" class="scanner-container">
                    <div class="scanner-light"></div>
                    <div class="scanner-bar">
                        <div class="scanner-dot"></div>
                        <div class="scanner-dot"></div>
                        <div class="scanner-dot"></div>
                        <div class="scanner-dot"></div>
                        <div class="scanner-dot"></div>
                        <div class="scanner-dot"></div>
                        <div class="scanner-dot"></div>
                        <div class="scanner-dot"></div>
                        <div class="scanner-dot"></div>
                        <div class="scanner-dot"></div>
                    </div>
                </div>

                <!-- Knight Rider Speaking Animation -->
                <div id="speakingAnimation" class="speaking-animation hidden">
                    <div class="speaking-bar"></div>
                    <div class="speaking-bar"></div>
                    <div class="speaking-bar"></div>
                    <div class="speaking-bar"></div>
                    <div class="speaking-bar"></div>
                    <div class="speaking-bar"></div>
                    <div class="speaking-bar"></div>
                    <div class="speaking-bar"></div>
                    <div class="speaking-bar"></div>
                    <div class="speaking-bar"></div>
                    <div class="speaking-bar"></div>
                    <div class="speaking-bar"></div>
                    <div class="speaking-bar"></div>
                    <div class="speaking-bar"></div>
                    <div class="speaking-bar"></div>
                    <div class="speaking-bar"></div>
                    <div class="speaking-bar"></div>
                    <div class="speaking-bar"></div>
                    <div class="speaking-bar"></div>
                    <div class="speaking-bar"></div>
                </div>

                <div id="currentText" class="current-text">
                    <span id="currentTextContent">Waiting for input...</span>
                    <span id="currentTextTimestamp" class="text-timestamp"></span>
                </div>
            </div>

            <!-- Character Panel -->
            <div class="character-panel" id="characterPanel">
                <div class="character-viewport">
                    <img id="characterFrame" src="/static/frames/idle_neutral.png" alt="Character">
                    <div class="scanline-overlay"></div>
                </div>
            </div>
        </div>

        <!-- Log Panel -->
        <div class="log-panel">
            <div class="log-header">
                <div class="log-header-left">
                    <div class="log-label-group">
                        <div class="log-label" id="logLabelDaily">DAY'S LOG — LIVE FEED</div>
                        <div class="log-label hidden" id="logLabelWeekly">WEEKLY INSIGHTS</div>
                        <div class="log-label hidden" id="logLabelMemory">LT MEMORY</div>
                    </div>
                    <div class="log-tabs">
                        <button id="tabDaily" class="log-tab active" data-tab="daily" title="Daily log">Daily</button>
                        <button id="tabWeekly" class="log-tab" data-tab="weekly" title="Weekly insights">Weekly</button>
                        <button id="tabMemory" class="log-tab" data-tab="memory" title="Long-term memory">LT Memory</button>
                    </div>
                </div>
                <div class="font-controls">
                    <button id="logFontDown" class="font-btn" title="Decrease font size">−</button>
                    <button id="logFontUp" class="font-btn" title="Increase font size">+</button>
                </div>
            </div>
            <pre id="logContent" class="log-content"></pre>
        </div>

        <!-- Agents Directory Panel -->
        <div class="agents-panel">
            <div class="agents-header">
                <div class="agents-label">AGENTS DIRECTORY</div>
                <div class="agents-controls">
                    <button id="agentsFontDown" class="font-btn" title="Decrease font size">−</button>
                    <button id="agentsFontUp" class="font-btn" title="Increase font size">+</button>
                    <button id="agentsToggle" class="agents-toggle" title="Toggle agents panel">▼</button>
                </div>
            </div>
            <div id="agentsContainer" class="agents-container"></div>
        </div>

        <!-- Status indicator -->
        <div id="status" class="status"></div>
    </div>

    <script src="/static/avatar-manager.js?v=1000"></script>
    <script src="/static/character.js?v=1000"></script>
    <script src="/static/app.js?v=1000"></script>
</body>
</html>
